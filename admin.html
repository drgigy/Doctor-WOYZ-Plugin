<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Doctor WOYZ device approval admin page.">
  <title>Doctor WOYZ Admin</title>
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <style>
    :root {
      --bg: #ffffff;
      --card: #101011;
      --card-soft: #171717;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --red: #ef4f4f;
      --red-dark: #b91c1c;
      --white: #ffffff;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    .topbar {
      min-height: 112px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      color: var(--text);
      text-decoration: none;
    }

    .brand-doctor {
      font-size: 32px;
      line-height: 1;
      font-weight: 900;
    }

    .brand-title {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      min-height: 60px;
      padding: 8px 28px 8px 14px;
      border: 5px solid var(--red);
      border-radius: 999px;
      background: #17181d;
      color: #ffffff;
      font-size: 32px;
      line-height: 1;
      font-weight: 900;
      box-shadow: 0 16px 34px rgba(239, 79, 79, 0.18);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 50%, var(--red) 0 34%, rgba(239, 79, 79, 0.18) 35% 100%);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 30px auto 48px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button {
      min-height: 48px;
      border: 2px solid var(--red);
      border-radius: 8px;
      color: #ffffff;
      background: var(--red);
      padding: 10px 18px;
      font-weight: 850;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(239, 79, 79, 0.18);
    }

    .button.secondary {
      color: var(--red-dark);
      background: #ffffff;
      box-shadow: none;
    }

    .admin-card {
      overflow: hidden;
      border: 1px solid #252525;
      border-radius: 8px;
      background: var(--card);
      color: var(--white);
      box-shadow: var(--shadow);
    }

    .login-panel {
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr) auto;
      margin-bottom: 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
    }

    .key-panel {
      grid-template-columns: minmax(240px, 1fr) auto;
    }

    .login-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .login-field input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      background: #ffffff;
      outline: none;
    }

    .login-field input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(239, 79, 79, 0.15);
    }

    .login-panel .button {
      align-self: end;
    }

    .admin-message {
      min-height: 20px;
      margin: 0 0 16px;
      color: #7f1d1d;
      font-size: 14px;
      font-weight: 700;
    }

    .admin-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px;
      border-bottom: 1px solid #282828;
    }

    .admin-card-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .status-pill {
      border: 1px solid rgba(239, 79, 79, 0.7);
      border-radius: 999px;
      padding: 6px 12px;
      color: #ffffff;
      background: rgba(239, 79, 79, 0.15);
      font-size: 13px;
      font-weight: 800;
    }

    .device-list {
      display: grid;
      gap: 12px;
      padding: 20px;
    }

    .device-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 16px;
      border: 1px solid #2f2f2f;
      border-radius: 8px;
      background: var(--card-soft);
    }

    .device-id {
      font: 850 18px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.03em;
      overflow-wrap: anywhere;
    }

    .device-meta {
      margin-top: 8px;
      color: #a1a1aa;
      font-size: 13px;
      line-height: 1.45;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .small-button {
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      color: #ffffff;
      background: #242424;
      padding: 8px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .small-button.approve {
      border-color: var(--red);
      background: var(--red);
    }

    .small-button.warning {
      color: #fecaca;
      border-color: rgba(239, 79, 79, 0.55);
      background: transparent;
    }

    .empty {
      padding: 34px 20px;
      color: #a1a1aa;
      text-align: center;
    }

    .notice {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid #fee2e2;
      border-radius: 8px;
      color: #7f1d1d;
      background: #fff1f2;
      font-size: 14px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 720px) {
      .topbar {
        min-height: 88px;
      }

      .brand-doctor,
      .brand-title {
        font-size: 24px;
      }

      .brand-title {
        min-height: 50px;
        padding-right: 20px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
      }

      .hero,
      .login-panel,
      .device-row,
      .admin-card-header {
        align-items: stretch;
        grid-template-columns: 1fr;
        flex-direction: column;
      }

      .actions,
      .row-actions {
        justify-content: stretch;
      }

      .button,
      .small-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-doctor">Doctor</span>
      <span class="brand-title"><span class="brand-mark" aria-hidden="true"></span><span>WOYZ</span></span>
    </a>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Admin</h1>
        <p>Approve or revoke devices allowed to use Doctor WOYZ.</p>
      </div>
      <div class="actions">
        <a class="button secondary" href="index.html">Back to App</a>
        <button class="button secondary hidden" id="signOutButton" type="button">Sign Out</button>
      </div>
    </section>

    <section class="login-panel" id="loginPanel">
      <div class="login-field">
        <label for="adminEmail">Admin Email</label>
        <input id="adminEmail" type="email" autocomplete="username">
      </div>
      <div class="login-field">
        <label for="adminPassword">Password</label>
        <input id="adminPassword" type="password" autocomplete="current-password">
      </div>
      <button class="button" id="signInButton" type="button">Sign In</button>
    </section>
    <p class="admin-message" id="adminMessage"></p>

    <section class="login-panel key-panel hidden" id="authorizationPanel" data-auth-only>
      <div class="login-field">
        <label for="adminAuthorizationKey">Authorization Key</label>
        <input id="adminAuthorizationKey" type="password" autocomplete="off" spellcheck="false" placeholder="Paste key to send to approved devices">
      </div>
      <button class="button" id="saveAuthorizationKeyButton" type="button">Save Key</button>
    </section>

    <section class="admin-card hidden" data-auth-only>
      <div class="admin-card-header">
        <h2>Device Lock</h2>
        <span class="status-pill" id="deviceCount">0 devices</span>
      </div>
      <div class="device-list" id="deviceList"></div>
    </section>

    <p class="notice hidden" data-auth-only>Use the admin account listed in the security rules. Devices can request access automatically; only admin can approve or revoke access.</p>
  </main>

  <script type="module">
    import {
      adminSignIn,
      adminSignOut,
      approveDevice,
      deviceId,
      removeDevice,
      revokeDevice,
      saveAuthorizationKey,
      watchAdminDevices,
      watchAdminSession
    } from "./device-approval.js";

    let devices = [];
    let unsubscribeDevices = null;
    let signedIn = false;

    function formatDate(value) {
      if (!value) return "Not recorded";
      try {
        const date = typeof value.toDate === "function" ? value.toDate() : new Date(value);
        return new Intl.DateTimeFormat("en-IN", {
          dateStyle: "medium",
          timeStyle: "short"
        }).format(date);
      } catch {
        return value;
      }
    }

    function statusLabel(status) {
      return status === "approved" ? "Approved" : "Pending";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setAdminMessage(message) {
      document.getElementById("adminMessage").textContent = message;
    }

    function renderDevices() {
      if (!signedIn) return;
      const id = deviceId();
      const sortedDevices = [...devices].sort((a, b) => {
        if (a.id === id) return -1;
        if (b.id === id) return 1;
        return String(b.requestedAt || "").localeCompare(String(a.requestedAt || ""));
      });
      const list = document.getElementById("deviceList");
      document.getElementById("deviceCount").textContent = `${sortedDevices.length} ${sortedDevices.length === 1 ? "device" : "devices"}`;

      if (!sortedDevices.length) {
        list.innerHTML = '<div class="empty">No device requests yet.</div>';
        return;
      }

      list.innerHTML = sortedDevices.map(device => {
        const safeId = escapeHtml(device.id);
        const safeLabel = escapeHtml(device.label || "Device");
        const safeUserName = escapeHtml(device.userName || "Name not entered");
        return `
        <article class="device-row">
          <div>
            <div class="device-id">${safeId}</div>
            <div class="device-meta">
              ${safeUserName} · ${device.id === id ? "This device" : safeLabel} · ${statusLabel(device.status)}<br>
              Requested: ${escapeHtml(formatDate(device.requestedAt))}${device.approvedAt ? `<br>Approved: ${escapeHtml(formatDate(device.approvedAt))}` : ""}
            </div>
          </div>
          <div class="row-actions">
            ${device.status === "approved"
              ? `<button class="small-button warning" data-action="revoke" data-id="${safeId}" type="button">Revoke</button>`
              : `<button class="small-button approve" data-action="approve" data-id="${safeId}" type="button">Approve</button>`}
            <button class="small-button" data-action="remove" data-id="${safeId}" type="button">Remove</button>
          </div>
        </article>
      `;
      }).join("");
    }

    function stopDeviceList() {
      if (unsubscribeDevices) {
        unsubscribeDevices();
        unsubscribeDevices = null;
      }
      devices = [];
      document.getElementById("deviceList").innerHTML = "";
      document.getElementById("deviceCount").textContent = "0 devices";
    }

    function setSignedIn(user) {
      signedIn = Boolean(user?.email && !user.isAnonymous);
      document.getElementById("loginPanel").classList.toggle("hidden", signedIn);
      document.getElementById("signOutButton").classList.toggle("hidden", !signedIn);
      document.querySelectorAll("[data-auth-only]").forEach(element => {
        element.classList.toggle("hidden", !signedIn);
      });
      if (signedIn) {
        setAdminMessage(`Signed in as ${user.email}.`);
        startDeviceList().catch(() => {
          setAdminMessage("Device list could not be loaded.");
        });
      } else {
        stopDeviceList();
      }
    }

    async function startDeviceList() {
      if (unsubscribeDevices) unsubscribeDevices();
      unsubscribeDevices = await watchAdminDevices(({ devices: nextDevices, error }) => {
        if (error) {
          setAdminMessage("Sign in with an approved admin account to view devices.");
          devices = [];
          renderDevices();
          return;
        }
        devices = nextDevices || [];
        setAdminMessage("");
        renderDevices();
      });
    }

    document.getElementById("signInButton").addEventListener("click", async () => {
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;
      if (!email || !password) {
        setAdminMessage("Enter admin email and password.");
        return;
      }
      try {
        await adminSignIn(email, password);
      } catch (error) {
        setAdminMessage("Admin sign in failed.");
      }
    });

    document.getElementById("signOutButton").addEventListener("click", async () => {
      await adminSignOut();
      setAdminMessage("Signed out.");
    });

    document.getElementById("saveAuthorizationKeyButton").addEventListener("click", async () => {
      const input = document.getElementById("adminAuthorizationKey");
      try {
        await saveAuthorizationKey(input.value);
        input.value = "";
        setAdminMessage("Authorization key saved. New approvals will receive it.");
      } catch (error) {
        setAdminMessage("Authorization key could not be saved.");
      }
    });

    document.getElementById("deviceList").addEventListener("click", async event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = button.dataset.id;
      try {
        if (button.dataset.action === "approve") await approveDevice(id);
        if (button.dataset.action === "revoke") await revokeDevice(id);
        if (button.dataset.action === "remove") await removeDevice(id);
        setAdminMessage("");
      } catch (error) {
        setAdminMessage("Admin action failed. Check sign in and rules.");
      }
    });

    watchAdminSession(({ user }) => {
      setSignedIn(user);
    }).catch(() => {
      setAdminMessage("Admin session could not be checked.");
    });
  </script>
</body>
</html>
